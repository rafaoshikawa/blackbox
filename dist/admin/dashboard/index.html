<!DOCTYPE html><html lang="pt"> <head><meta charset="UTF-8"><title>Dashboard</title><link rel="stylesheet" href="/_astro/dashboard.Cku9oxni.css"></head> <body> <div id="auth-guard" style="display:none;"> <div class="dashboard-header"> <div class="dashboard-header-2"> <h1>Dashboard</h1> <button id="logout" class="logout-btn">Logout</button> </div> <button id="delete-selected" class="delete-selected">
🗑 Apagar Selecionados
</button> </div> <div class="cars-grid" id="cars-grid"></div> <button class="fab" id="open-modal">+</button> <!-- MODAL --> <div class="modal" id="modal"> <div class="modal-content"> <button class="close-modal" id="close-modal">×</button> <h2>Carro</h2> <label for="brand">Nome</label> <input id="brand"> <label for="model">Descrição</label> <input id="model"> <label for="price">Preço</label> <input id="price"> <label for="year">Ano</label> <input id="year"> <label for="km">Km</label> <input id="km"> <label for="fuel">Combustível</label> <input id="fuel"> <label for="caixa">Caixa</label> <input id="caixa"> <label for="cilindrada">Cilindrada</label> <input id="cilindrada"> <label for="potencia">Potencia</label> <input id="potencia"> <label for="segmento">Segmento</label> <input id="segmento"> <label for="status">Status</label> <input id="status" placeholder="vendido/reservado/disponivel"> <input type="file" id="galleryImages" accept="image/*" multiple style="display:none"> <div id="image-manager"> <h4>Imagens · 1ª é a capa · arrasta ≡ para reordenar</h4> <div class="img-list" id="img-list"></div> <button class="add-image-btn" id="add-image-btn">+ Adicionar Imagens</button> </div> <button id="save-car">Guardar</button> </div> </div> <!-- CONFIRM DELETE --> <div id="confirm-overlay" class="confirm-overlay"> <div class="confirm-box"> <p>Tens certeza que queres remover este item?</p> <div class="confirm-actions"> <button id="confirm-no">Cancelar</button> <button id="confirm-yes">Apagar</button> </div> </div> </div> <!-- IMAGE PREVIEW fullscreen --> <div id="image-preview" class="image-preview"> <div class="image-preview-inner"> <img id="image-preview-img"> <button id="close-preview">×</button> </div> </div> </div> <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

      const supabase = createClient(
        "https://ziylcoupschcusnlsblu.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppeWxjb3Vwc2NoY3VzbmxzYmx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMDAwMjksImV4cCI6MjA5NTc3NjAyOX0.6HdFwkPcwxUTlbKvhr3EoSI1qz3U9e3fCeITLr8eVmY",
      );

      const authGuard         = document.getElementById("auth-guard");
      const carsGrid          = document.getElementById("cars-grid");
      const modal             = document.getElementById("modal");
      const closeModalBtn     = document.getElementById("close-modal");
      const confirmOverlay    = document.getElementById("confirm-overlay");
      const confirmYes        = document.getElementById("confirm-yes");
      const confirmNo         = document.getElementById("confirm-no");
      const galleryInput      = document.getElementById("galleryImages");
      const imgList           = document.getElementById("img-list");
      const addImageBtn       = document.getElementById("add-image-btn");
      const preview           = document.getElementById("image-preview");
      const previewImg        = document.getElementById("image-preview-img");
      const closePreview      = document.getElementById("close-preview");
      const deleteSelectedBtn = document.getElementById("delete-selected");

      const fields = {
        brand:      document.getElementById("brand"),
        model:      document.getElementById("model"),
        year:       document.getElementById("year"),
        price:      document.getElementById("price"),
        km:         document.getElementById("km"),
        fuel:       document.getElementById("fuel"),
        caixa:      document.getElementById("caixa"),
        segmento:   document.getElementById("segmento"),
        cilindrada: document.getElementById("cilindrada"),
        potencia:   document.getElementById("potencia"),
        status:     document.getElementById("status"),
      };

      let editingId    = null;
      let deleteId     = null;
      let deleteMode   = null;
      let deleteIds    = [];
      let imageSlots   = [];
      let dragSrcIndex = null;

      const { data: { session } } = await supabase.auth.getSession();
      if (!session) {
        window.location.href = "/admin";
      } else {
        authGuard.style.display = "block";
      }

      async function loadCars() {
        const { data: cars } = await supabase
          .from("cars")
          .select("*")
          .order("id", { ascending: false });
        renderCars(cars ?? []);
      }

      function renderCars(cars) {
        carsGrid.innerHTML = "";
        cars.forEach((car) => carsGrid.appendChild(createCarCard(car)));
      }

      function createCarCard(car) {
        const card = document.createElement("div");
        card.className = "car-card";
        card.dataset.id = car.id;
        card.innerHTML = `
          <input type="checkbox" class="checkbox" />
          <img src="${car.image ?? ""}" class="car-image" />
          <div class="car-content">
            <h3>${car.brand ?? ""}</h3>
            <p>${car.model ?? ""}</p>
            <div class="car-meta">
              <span>${car.year ?? ""}</span>
              <span>${car.price ?? ""}</span>
            </div>
            <div class="car-actions">
              <button class="edit-btn">✏ Editar</button>
              <button class="delete-btn">🗑 Apagar</button>
            </div>
          </div>
        `;
        return card;
      }

      function clearForm() {
        Object.values(fields).forEach((f) => (f.value = ""));
        galleryInput.value = "";
        imageSlots = [];
        renderList();
      }

      function openPreview(url) {
        previewImg.src = url;
        preview.classList.add("active");
      }

      closePreview.onclick = () => preview.classList.remove("active");

      function slotPreviewUrl(slot) {
        return slot.type === "existing" ? slot.url : URL.createObjectURL(slot.file);
      }

      function slotLabel(slot) {
        if (slot.type === "new") return slot.file.name;
        return decodeURIComponent(slot.url.split("?")[0].split("/").pop());
      }

      async function uploadFile(file) {
        const path = `${Date.now()}-${Math.random().toString(36).slice(2)}-${file.name}`;
        const { error } = await supabase.storage.from("cars").upload(path, file);
        if (error) throw error;
        return supabase.storage.from("cars").getPublicUrl(path).data.publicUrl;
      }

      function renderList() {
        imgList.innerHTML = "";
        imageSlots.forEach((slot, index) => {
          const row = document.createElement("div");
          row.className = "img-row" + (index === 0 ? " is-cover" : "");
          row.draggable = true;
          row.dataset.index = index;

          const num = document.createElement("span");
          num.className = "row-num";
          num.textContent = index + 1;

          const handle = document.createElement("div");
          handle.className = "drag-handle";
          handle.innerHTML = "≡";
          handle.title = "Arrastar para reordenar";

          const name = document.createElement("span");
          name.className = "row-name";
          name.textContent = slotLabel(slot);
          name.title = "Ver em grande";
          name.onclick = (e) => {
            e.stopPropagation();
            openPreview(slotPreviewUrl(slot));
          };

          const removeBtn = document.createElement("button");
          removeBtn.className = "remove-row";
          removeBtn.innerHTML = "🗑";
          removeBtn.title = "Remover";
          removeBtn.onclick = (e) => {
            e.stopPropagation();
            imageSlots.splice(index, 1);
            renderList();
          };

          row.appendChild(num);
          row.appendChild(handle);
          row.appendChild(name);
          row.appendChild(removeBtn);

          row.addEventListener("dragstart",  onDragStart);
          row.addEventListener("dragover",   onDragOver);
          row.addEventListener("dragleave",  onDragLeave);
          row.addEventListener("drop",       onDrop);
          row.addEventListener("dragend",    onDragEnd);

          imgList.appendChild(row);
        });
      }

      function onDragStart(e) {
        dragSrcIndex = parseInt(this.dataset.index);
        this.classList.add("dragging");
        e.dataTransfer.effectAllowed = "move";
      }
      function onDragOver(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        this.classList.add("drag-over");
      }
      function onDragLeave() {
        this.classList.remove("drag-over");
      }
      function onDrop(e) {
        e.preventDefault();
        this.classList.remove("drag-over");
        const targetIndex = parseInt(this.dataset.index);
        if (dragSrcIndex === null || dragSrcIndex === targetIndex) return;
        const moved = imageSlots.splice(dragSrcIndex, 1)[0];
        imageSlots.splice(targetIndex, 0, moved);
        renderList();
      }
      function onDragEnd() {
        dragSrcIndex = null;
        imgList.querySelectorAll(".img-row").forEach((el) =>
          el.classList.remove("dragging", "drag-over")
        );
      }

      addImageBtn.onclick = () => galleryInput.click();
      galleryInput.addEventListener("change", (e) => {
        const files = Array.from(e.target.files);
        const available = 15 - imageSlots.length;
        files.slice(0, available).forEach((file) =>
          imageSlots.push({ type: "new", file })
        );
        renderList();
        galleryInput.value = "";
      });

      function openModal() {
        document.querySelectorAll(".checkbox").forEach((c) => (c.checked = false));
        modal.classList.add("active");
      }
      function closeModal() {
        modal.classList.remove("active");
        clearForm();
      }

      document.getElementById("open-modal").onclick = () => {
        editingId = null;
        clearForm();
        openModal();
      };
      closeModalBtn.onclick = closeModal;
      modal.onclick = (e) => { if (e.target === modal) closeModal(); };

      carsGrid.addEventListener("click", async (e) => {
        const card = e.target.closest(".car-card");
        if (!card) return;
        const id = card.dataset.id;

        if (e.target.classList.contains("edit-btn")) {
          const { data } = await supabase
            .from("cars").select("*").eq("id", id).maybeSingle();
          if (!data) return;

          editingId = id;
          Object.keys(fields).forEach((k) => { fields[k].value = data[k] ?? ""; });

          imageSlots = [];
          if (data.images && data.images.length > 0) {
            data.images.forEach((url) => imageSlots.push({ type: "existing", url }));
            if (data.image) {
              const coverIdx = imageSlots.findIndex((s) => s.url === data.image);
              if (coverIdx > 0) {
                const [coverSlot] = imageSlots.splice(coverIdx, 1);
                imageSlots.unshift(coverSlot);
              } else if (coverIdx === -1) {
                imageSlots.unshift({ type: "existing", url: data.image });
              }
            }
          } else if (data.image) {
            imageSlots.push({ type: "existing", url: data.image });
          }

          renderList();
          openModal();
        }

        if (e.target.classList.contains("delete-btn")) {
          deleteId   = id;
          deleteMode = "single";
          confirmOverlay.classList.add("active");
        }
      });

      document.getElementById("save-car").onclick = async () => {
        const saveBtn = document.getElementById("save-car");
        saveBtn.disabled = true;
        saveBtn.textContent = "A guardar...";

        try {
          const payload = {};
          Object.keys(fields).forEach((k) => { payload[k] = fields[k].value; });

          const resolvedUrls = await Promise.all(
            imageSlots.map((slot) =>
              slot.type === "existing"
                ? Promise.resolve(slot.url)
                : uploadFile(slot.file)
            )
          );

          payload.images = resolvedUrls;
          payload.image  = resolvedUrls[0] ?? "";

          if (editingId) {
            const { data: updated } = await supabase
              .from("cars").update(payload).eq("id", editingId).select().maybeSingle();
            if (updated) {
              const existingCard = carsGrid.querySelector(`[data-id="${editingId}"]`);
              if (existingCard) existingCard.replaceWith(createCarCard(updated));
            }
          } else {
            const { data: inserted } = await supabase
              .from("cars").insert([payload]).select().maybeSingle();
            if (inserted) carsGrid.prepend(createCarCard(inserted));
          }

          closeModal();
        } catch (err) {
          console.error("Erro ao guardar:", err);
          alert("Erro ao guardar. Verifica a consola.");
        } finally {
          saveBtn.disabled = false;
          saveBtn.textContent = "Guardar";
        }
      };

      confirmNo.onclick  = () => confirmOverlay.classList.remove("active");
      confirmYes.onclick = async () => {
        if (deleteMode === "single" && deleteId) {
          await supabase.from("cars").delete().eq("id", deleteId);
          carsGrid.querySelector(`[data-id="${deleteId}"]`)?.remove();
          deleteId = null;
        }
        if (deleteMode === "bulk" && deleteIds.length > 0) {
          await supabase.from("cars").delete().in("id", deleteIds);
          deleteIds.forEach((id) =>
            carsGrid.querySelector(`[data-id="${id}"]`)?.remove()
          );
          deleteIds = [];
        }
        confirmOverlay.classList.remove("active");
        deleteMode = null;
      };

      deleteSelectedBtn.onclick = () => {
        const checked = [...document.querySelectorAll(".checkbox:checked")];
        if (checked.length === 0) return;
        deleteIds  = checked.map((c) => c.closest(".car-card").dataset.id);
        deleteMode = "bulk";
        confirmOverlay.classList.add("active");
      };

      document.getElementById("logout").onclick = async () => {
        await supabase.auth.signOut();
        location.href = "/admin";
      };

      if (session) await loadCars();
    </script> </body> </html>
