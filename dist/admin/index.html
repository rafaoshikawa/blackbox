<!DOCTYPE html><html lang="pt"> <head><meta charset="UTF-8"><title>Login Admin</title><style>.login-body{margin:0;font-family:system-ui,sans-serif;background:#0b0f17;color:#fff;display:flex;justify-content:center;align-items:center;height:100vh}.login-container{width:360px;background:#111827;padding:28px;border-radius:14px;box-shadow:0 20px 60px #00000080}.login-title{font-size:24px;margin-bottom:18px;text-align:center}.login-form{display:flex;flex-direction:column;gap:12px}.login-input{padding:12px;border-radius:10px;border:1px solid #2a2f3a;background:#0b1220;color:#fff;outline:none}.login-input:focus{border-color:#3b82f6}.login-button{padding:12px;border:none;border-radius:10px;background:#3b82f6;color:#fff;font-weight:600;cursor:pointer;transition:.2s}.login-button:hover{background:#2563eb}.login-error{margin-top:10px;font-size:13px;color:#ef4444;text-align:center}
</style></head> <body class="login-body"> <div class="login-container"> <h1 class="login-title">Login</h1> <form id="login-form" class="login-form" accept-charset="utf-8"> <input class="login-input" name="email" type="email" placeholder="Email" required> <input class="login-input" name="password" type="password" placeholder="Password" required> <button class="login-button" type="submit">Entrar</button> </form> <p id="error" class="login-error"></p> </div> <script type="module">
      import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

      const supabase = createClient(
        "https://ziylcoupschcusnlsblu.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InppeWxjb3Vwc2NoY3VzbmxzYmx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyMDAwMjksImV4cCI6MjA5NTc3NjAyOX0.6HdFwkPcwxUTlbKvhr3EoSI1qz3U9e3fCeITLr8eVmY",
      );

      const form = document.getElementById("login-form");
      const errorMsg = document.getElementById("error");

      console.log("LOGIN PAGE OK");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const formData = new FormData(form);

        const email = formData.get("email");
        const password = formData.get("password");

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        console.log("LOGIN:", { data, error });

        if (error) {
          errorMsg.textContent = error.message;
          return;
        }

        window.location.href = "/admin/dashboard";
      });
    </script> </body> </html>
